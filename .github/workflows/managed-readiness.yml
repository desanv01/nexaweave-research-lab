name: Managed installed readiness

on:
  pull_request:
    paths:
      - '.github/workflows/managed-readiness.yml'
      - 'backend/**'
      - 'services/knowledge/**'
      - 'tools/apply_native_import_patch.py'
      - 'tools/native_store_ci_postgres.ps1'
      - 'tools/native_temporal_ci_server.ps1'
      - 'tools/run_installed_readiness_tests.py'
      - 'tools/run_unit_tests.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/managed-readiness.yml'
      - 'backend/**'
      - 'services/knowledge/**'
      - 'tools/apply_native_import_patch.py'
      - 'tools/native_store_ci_postgres.ps1'
      - 'tools/native_temporal_ci_server.ps1'
      - 'tools/run_installed_readiness_tests.py'
      - 'tools/run_unit_tests.py'

permissions:
  contents: read

jobs:
  w81-managed-readiness-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PROJECT_STORE_TEST_PASSWORD: nexaweave-ci-disposable-native-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.25'
      - name: Install inherited locked backend runtime
        run: uv sync --project backend --locked --extra dev --extra native-store --extra native-temporal --python 3.12.13
      - name: Apply and verify the native optional import correction
        run: |
          backend/.venv/Scripts/python.exe tools/apply_native_import_patch.py --apply
          if ($LASTEXITCODE -ne 0) { throw 'Native optional import correction failed' }
          backend/.venv/Scripts/python.exe tools/apply_native_import_patch.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Native optional import fingerprint verification failed' }
      - name: Install the locked knowledge profile
        working-directory: services/knowledge
        run: uv sync --locked --extra test --python 3.12.13
      - name: Install the candidate knowledge package in both profiles
        run: |
          uv pip install --python backend/.venv/Scripts/python.exe --no-deps services/knowledge
          if ($LASTEXITCODE -ne 0) { throw 'Backend execution overlay installation failed' }
          uv pip install --python services/knowledge/.venv/Scripts/python.exe --no-deps --reinstall services/knowledge
          if ($LASTEXITCODE -ne 0) { throw 'Non-editable knowledge installation failed' }
      - name: Start a fresh disposable PostgreSQL fixture
        run: ./tools/native_store_ci_postgres.ps1 -Action start
      - name: Qualify one installed managed startup case
        env:
          NEXAWEAVE_W81_MANAGED_READINESS: '1'
          NEXAWEAVE_W81_MANAGED_TEMPORAL_ADDRESS: '127.0.0.1:17233'
        run: |
          $env:NEXAWEAVE_WORKBENCH_BACKEND_PYTHON = (Resolve-Path backend/.venv/Scripts/python.exe).Path
          $knowledgePython = (Resolve-Path services/knowledge/.venv/Scripts/python.exe).Path
          $witnessLog = Join-Path $env:RUNNER_TEMP ('nexaweave-managed-readiness-' + [Guid]::NewGuid().ToString('N') + '.log')
          $fixtureRoot = Join-Path ([IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')) 'nexaweave-native-temporal'
          $ownerPath = Join-Path $fixtureRoot 'owner.json'
          $executable = Join-Path $fixtureRoot 'bin/temporal.exe'
          $database = Join-Path $fixtureRoot 'test.db'

          function Get-TemporalOwner {
            $record = Get-Content -LiteralPath $ownerPath -Raw | ConvertFrom-Json -AsHashtable -DateKind String
            if ($record.Count -ne 4 -or $record.executable -ne $executable -or $record.database -ne $database -or
                ($record.pid -isnot [int] -and $record.pid -isnot [long]) -or
                $record.pid -le 0 -or $record.pid -gt [int]::MaxValue -or $record.started_at -isnot [string]) {
              throw 'Invalid managed Temporal owner record'
            }
            $started = [DateTime]::MinValue
            if (-not [DateTime]::TryParseExact($record.started_at, 'o',
                [Globalization.CultureInfo]::InvariantCulture, [Globalization.DateTimeStyles]::RoundtripKind, [ref]$started) -or
                $started.Kind -ne [DateTimeKind]::Utc) {
              throw 'Invalid managed Temporal start identity'
            }
            $process = Get-Process -Id $record.pid
            try {
              # Keep the actual process handle for the exit check, even if the PID is later reused.
              [void]$process.SafeHandle
              $details = Get-CimInstance Win32_Process -Filter ('ProcessId = ' + $record.pid)
              if ($details.ExecutablePath -ne $executable -or -not $details.CommandLine -or
                  -not $details.CommandLine.Contains($database) -or $process.HasExited -or
                  $process.StartTime.ToUniversalTime().Ticks -ne $started.Ticks) {
                throw 'Managed Temporal process identity mismatch'
              }
              return @{ process = $process; pid = $record.pid; start_ticks = $started.Ticks }
            } catch {
              $process.Dispose()
              throw
            }
          }

          function Get-TemporalListeners {
            Get-NetTCPConnection -State Listen -ErrorAction Stop | Where-Object LocalPort -eq 17233
          }

          function Assert-TemporalListener($identity) {
            $listeners = @(Get-TemporalListeners)
            if ($identity.process.HasExited -or $listeners.Count -ne 1 -or
                $listeners[0].LocalAddress -ne '127.0.0.1' -or $listeners[0].OwningProcess -ne $identity.pid) {
              throw 'Managed Temporal listener custody mismatch'
            }
          }

          function Assert-SameTemporalOwner($identity, [switch]$Listener) {
            $current = Get-TemporalOwner
            try {
              if ($current.pid -ne $identity.pid -or $current.start_ticks -ne $identity.start_ticks -or $identity.process.HasExited) {
                throw 'Managed Temporal owner changed'
              }
              if ($Listener) { Assert-TemporalListener $current }
            } finally {
              $current.process.Dispose()
            }
          }

          $identity = $caseFailure = $null
          $custodyFailed = $cleanupFailed = $false
          try {
            & ./tools/native_temporal_ci_server.ps1 -Action start
            if ($LASTEXITCODE -ne 0) { throw 'Managed Temporal fixture start failed' }
            $identity = Get-TemporalOwner
            Assert-TemporalListener $identity
            Write-Output 'managed_temporal_custody_before=1'
            try {
              & $knowledgePython -I -u tools/run_installed_readiness_tests.py | Tee-Object -FilePath $witnessLog
              if ($LASTEXITCODE -ne 0) { throw 'Installed managed readiness qualification failed' }
              # The runner emits this marker only after one pass, zero skips and owned cleanup.
              if (@(Select-String -LiteralPath $witnessLog -Pattern '^installed_managed_readiness_passed$').Count -ne 1) {
                throw 'Missing unique installed managed readiness witness'
              }
            } catch {
              $caseFailure = $_
            } finally {
              try {
                Assert-SameTemporalOwner $identity -Listener
                Write-Output 'managed_temporal_custody_after=1'
              } catch {
                $custodyFailed = $true
                Write-Warning 'Managed Temporal after-case custody failed'
              }
            }
          } catch {
            $custodyFailed = $true
            Write-Warning 'Managed Temporal startup or before-case custody failed'
          } finally {
            try {
              if ($null -ne $identity) { Assert-SameTemporalOwner $identity }
              & ./tools/native_temporal_ci_server.ps1 -Action stop
              if ($LASTEXITCODE -ne 0 -or @(Get-TemporalListeners).Count -ne 0 -or
                  ($null -ne $identity -and -not $identity.process.WaitForExit(0))) {
                throw 'Managed Temporal cleanup could not be proved'
              }
              if ($null -ne $identity) { Write-Output 'managed_temporal_ordinary_stop=1' }
            } catch {
              $cleanupFailed = $true
              Write-Warning 'Managed Temporal ordinary cleanup failed'
            } finally {
              if ($null -ne $identity) { $identity.process.Dispose() }
            }
          }
          if ($null -ne $caseFailure) { throw $caseFailure }
          if ($custodyFailed) { throw 'Managed Temporal custody failed' }
          if ($cleanupFailed) { throw 'Managed Temporal cleanup failed' }
      - name: Stop only this job's Temporal fixture
        if: always()
        run: ./tools/native_temporal_ci_server.ps1 -Action stop
      - name: Stop only this job's PostgreSQL fixture
        if: always()
        run: ./tools/native_store_ci_postgres.ps1 -Action stop
