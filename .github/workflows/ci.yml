name: CI

on:
  push:
    branches: [main, 'phase/**', 'task/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-manifest:
    name: baseline-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/check_baseline_manifest.py

  python-unit:
    name: python-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixture/unit dependencies only
        run: python -m pip install -r tools/ci-unit-requirements.txt
      - name: Run inherited offline unit suites
        run: python tools/run_unit_tests.py

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build

  knowledge-compatibility:
    name: knowledge-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KNOWLEDGE_TEST_PASSWORD: mirofish-ci-disposable-fixture-only
      GRAPHITI_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.25'
      - name: Install locked isolated knowledge runtime
        working-directory: services/knowledge
        run: uv sync --locked --extra test --python 3.12.13
      - name: Start disposable real Neo4j Community
        run: docker compose -f infra/compose.knowledge-test.yml up -d --wait --wait-timeout 180
      - name: Run contracts and real database tests with fake models
        run: services/knowledge/.venv/bin/python tools/run_knowledge_tests.py --neo4j
      - name: Test database diagnostics on failure
        if: failure()
        run: docker compose -f infra/compose.knowledge-test.yml logs --tail 100 neo4j
      - name: Remove only this job's disposable database
        if: always()
        run: docker compose -f infra/compose.knowledge-test.yml down -v

  knowledge-operations:
    name: knowledge-operations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KNOWLEDGE_POSTGRES_TEST_PASSWORD: mirofish-ci-disposable-operations-only
      GRAPHITI_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.25'
      - name: Install locked isolated knowledge runtime
        working-directory: services/knowledge
        run: uv sync --locked --extra test --python 3.12.13
      - name: Start disposable PostgreSQL
        run: docker compose -f infra/compose.operations-test.yml up -d --wait --wait-timeout 120
      - name: Verify real operation admission and concurrency
        run: services/knowledge/.venv/bin/python tools/run_operations_tests.py --postgres
      - name: Test database diagnostics on failure
        if: failure()
        run: docker compose -f infra/compose.operations-test.yml logs --tail 100 postgres
      - name: Remove only this job's disposable database
        if: always()
        run: docker compose -f infra/compose.operations-test.yml down -v

  native-engine-windows:
    name: native-engine-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.25'
      - name: Install inherited locked backend runtime
        run: uv sync --project backend --frozen --extra dev --python 3.12.13
      - name: Verify native imports without credentials or downloads
        run: backend/.venv/Scripts/python.exe tools/check_engine_imports.py
      - name: Exercise actual native action primitives with temporary SQLite
        run: backend/.venv/Scripts/python.exe tools/run_engine_tests.py
