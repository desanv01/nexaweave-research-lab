name: CI

on:
  push:
    branches: [main, 'phase/**', 'task/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-manifest:
    name: baseline-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/check_baseline_manifest.py
      - name: Qualify exact committed source artifact without publishing
        run: python tools/run_source_release_artifact.py

  python-unit:
    name: python-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixture/unit dependencies only
        run: python -m pip install -r tools/ci-unit-requirements.txt
      - name: Run inherited offline unit suites
        run: python tools/run_unit_tests.py

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  knowledge-compatibility:
    name: knowledge-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KNOWLEDGE_TEST_PASSWORD: mirofish-ci-disposable-fixture-only
      PROJECT_STORE_TEST_PASSWORD: mirofish-ci-disposable-operations-only
      KNOWLEDGE_POSTGRES_TEST_PASSWORD: mirofish-ci-disposable-operations-only
      GRAPHITI_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.25'
      - name: Install locked isolated knowledge runtime
        working-directory: services/knowledge
        run: uv sync --locked --extra test --extra source-pdf --python 3.12.13
      - name: Install separate locked HTTP backend and non-editable knowledge package
        shell: bash
        run: |
          set -euo pipefail
          uv export --locked --project backend --no-dev --no-emit-project --prune openai --prune zep-cloud --prune httpx --prune camel-oasis --prune camel-ai --prune pymupdf --prune charset-normalizer --prune chardet --prune pydantic --output-file "$RUNNER_TEMP/workbench-backend.txt" >/dev/null
          uv venv --python 3.12.13 "$RUNNER_TEMP/workbench-backend"
          uv pip install --require-hashes --python "$RUNNER_TEMP/workbench-backend/bin/python" -r "$RUNNER_TEMP/workbench-backend.txt"
          uv pip install --python services/knowledge/.venv/bin/python --no-deps --reinstall services/knowledge
          printf 'MIROFISH_WORKBENCH_BACKEND_PYTHON=%s\n' "$RUNNER_TEMP/workbench-backend/bin/python" >> "$GITHUB_ENV"
      - name: Start disposable real Neo4j Community
        run: docker compose -f infra/compose.knowledge-test.yml up -d --wait --wait-timeout 180
      - name: Start disposable research PostgreSQL
        run: docker compose -f infra/compose.operations-test.yml up -d --wait --wait-timeout 120
      - name: Run contracts and real database tests with fake models
        run: services/knowledge/.venv/bin/python tools/run_knowledge_tests.py --neo4j
      - name: Qualify local-only knowledge policy and actual SDK requests
        run: services/knowledge/.venv/bin/python tools/run_local_provider_tests.py --neo4j
      - name: Qualify temporal layered research and retained citations with real stores
        run: services/knowledge/.venv/bin/python tools/run_evidence_research_tests.py --integration
      - name: Qualify cited evidence dossiers and fresh JSON CLI with real stores
        run: services/knowledge/.venv/bin/python tools/run_evidence_dossier_tests.py --integration
      - name: Qualify authenticated HTTP and installed evidence child with real stores
        run: services/knowledge/.venv/bin/python tools/run_workbench_evidence_tests.py --integration
      - name: Require actual optional PDF parser and cold source profile checks
        run: services/knowledge/.venv/bin/python tools/run_pdf_source_tests.py
      - name: Qualify protected retained-source HTTP and installed PG-only child
        run: services/knowledge/.venv/bin/python tools/run_source_library_tests.py
      - name: Qualify connected source ingestion with real stores and local synthetic SDK
        run: services/knowledge/.venv/bin/python tools/run_source_ingestion_tests.py
      - name: Test database diagnostics on failure
        if: failure()
        run: docker compose -f infra/compose.knowledge-test.yml logs --tail 100 neo4j
      - name: Remove only this job's disposable database
        if: always()
        run: docker compose -f infra/compose.knowledge-test.yml down -v
      - name: Remove only this job's research PostgreSQL
        if: always()
        run: docker compose -f infra/compose.operations-test.yml down -v

  knowledge-operations:
    name: knowledge-operations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KNOWLEDGE_POSTGRES_TEST_PASSWORD: mirofish-ci-disposable-operations-only
      GRAPHITI_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.25'
      - name: Install locked isolated knowledge runtime
        working-directory: services/knowledge
        run: uv sync --locked --extra test --python 3.12.13
      - name: Start disposable PostgreSQL
        run: docker compose -f infra/compose.operations-test.yml up -d --wait --wait-timeout 120
      - name: Verify real operation admission and concurrency
        run: services/knowledge/.venv/bin/python tools/run_operations_tests.py --postgres
      - name: Test database diagnostics on failure
        if: failure()
        run: docker compose -f infra/compose.operations-test.yml logs --tail 100 postgres
      - name: Remove only this job's disposable database
        if: always()
        run: docker compose -f infra/compose.operations-test.yml down -v

  temporal-execution:
    name: temporal-execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_STORE_TEST_PASSWORD: mirofish-ci-disposable-operations-only
      KNOWLEDGE_POSTGRES_TEST_PASSWORD: mirofish-ci-disposable-operations-only
      TEMPORAL_TEST_ADDRESS: '127.0.0.1:17233'
      GRAPHITI_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.25'
      - name: Install locked opt-in execution runtime
        working-directory: services/knowledge
        run: uv sync --locked --extra test --extra execution --python 3.12.13
      - name: Download checksum-pinned disposable Temporal server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mirofish-temporal"
          cd "$RUNNER_TEMP/mirofish-temporal"
          curl --fail --location --retry 3 --max-time 120 --output temporal.tar.gz https://github.com/temporalio/cli/releases/download/v1.9.1/temporal_cli_1.9.1_linux_amd64.tar.gz
          printf '%s\n' '09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5  temporal.tar.gz' | sha256sum --check --strict
          tar -xzf temporal.tar.gz temporal
      - name: Start disposable PostgreSQL
        run: docker compose -f infra/compose.operations-test.yml up -d --wait --wait-timeout 120
      - name: Qualify real workflow, activity, replay and budget path with fake models
        shell: bash
        run: |
          set -euo pipefail
          temporal_bin="$RUNNER_TEMP/mirofish-temporal/temporal"
          "$temporal_bin" server start-dev --headless --ip 127.0.0.1 --port 17233 --http-port 17234 --metrics-port 17235 --db-filename "$RUNNER_TEMP/mirofish-temporal/test.db" > "$RUNNER_TEMP/mirofish-temporal/server.log" 2>&1 &
          temporal_pid=$!
          trap 'kill "$temporal_pid" 2>/dev/null || true; wait "$temporal_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if "$temporal_bin" operator cluster health --address 127.0.0.1:17233 --command-timeout 2s >/dev/null 2>&1; then
              ready=true
              break
            fi
            kill -0 "$temporal_pid"
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -100 "$RUNNER_TEMP/mirofish-temporal/server.log"
            exit 1
          fi
          services/knowledge/.venv/bin/python tools/run_temporal_execution_tests.py --integration
      - name: Test service diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose -f infra/compose.operations-test.yml logs --tail 100 postgres
          if [ -f "$RUNNER_TEMP/mirofish-temporal/server.log" ]; then
            tail -100 "$RUNNER_TEMP/mirofish-temporal/server.log"
          fi
      - name: Remove only this job's disposable database
        if: always()
        run: docker compose -f infra/compose.operations-test.yml down -v

  native-engine-windows:
    name: native-engine-windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PROJECT_STORE_TEST_PASSWORD: mirofish-ci-disposable-native-only
      TEMPORAL_TEST_ADDRESS: '127.0.0.1:17233'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.25'
      - name: Install inherited locked backend runtime
        run: uv sync --project backend --locked --extra dev --extra native-store --extra native-temporal --python 3.12.13
      - name: Install fixed experiment child package and select explicit test runtimes
        shell: pwsh
        run: |
          uv pip install --python backend/.venv/Scripts/python.exe --no-deps services/knowledge
          if ($LASTEXITCODE -ne 0) { throw 'Installed experiment child package failed' }
          $experimentPython = (Resolve-Path backend/.venv/Scripts/python.exe).Path
          $experimentBootstrap = & $experimentPython -I -c "import importlib.util; print(importlib.util.find_spec('mirofish_knowledge.read_bootstrap').origin)"
          if ($LASTEXITCODE -ne 0) { throw 'Installed bootstrap selection failed' }
          "MIROFISH_EXPERIMENT_TEST_PYTHON=$experimentPython" >> $env:GITHUB_ENV
          "MIROFISH_EXPERIMENT_TEST_HTTP_PYTHON=$experimentPython" >> $env:GITHUB_ENV
          "MIROFISH_EXPERIMENT_TEST_BOOTSTRAP=$experimentBootstrap" >> $env:GITHUB_ENV
      - name: Qualify actual owned Windows parser and knowledge process trees
        run: |
          backend/.venv/Scripts/python.exe tools/run_owned_process_tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Owned Windows process qualification failed' }
      - name: Verify native imports without credentials or downloads
        run: backend/.venv/Scripts/python.exe tools/check_engine_imports.py
      - name: Exercise actual native action primitives with temporary SQLite
        run: backend/.venv/Scripts/python.exe tools/run_engine_tests.py
      - name: Start job-local PostgreSQL with hosted binaries
        run: ./tools/native_store_ci_postgres.ps1 -Action start
      - name: Qualify actual prepared native engine with PostgreSQL ownership
        run: backend/.venv/Scripts/python.exe tools/run_native_store_tests.py --postgres
      - name: Qualify prepared native engine through Temporal and PostgreSQL
        shell: pwsh
        run: |
          # Keep the Windows child server in this shell's lifetime; Actions can
          # terminate child processes when the step that launched them exits.
          try {
            ./tools/native_temporal_ci_server.ps1 -Action start
            if ($LASTEXITCODE -ne 0) { throw 'Temporal fixture start failed' }
            backend/.venv/Scripts/python.exe tools/run_native_temporal_tests.py --integration
            if ($LASTEXITCODE -ne 0) { throw 'Prepared native Temporal qualification failed' }
          } finally {
            ./tools/native_temporal_ci_server.ps1 -Action stop
          }
      - name: Stop only this job's Temporal fixture
        if: always()
        run: ./tools/native_temporal_ci_server.ps1 -Action stop
      - name: Stop only this job's native PostgreSQL fixture
        if: always()
        run: ./tools/native_store_ci_postgres.ps1 -Action stop

  project-store:
    name: project-store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_STORE_TEST_PASSWORD: mirofish-ci-disposable-operations-only
      KNOWLEDGE_POSTGRES_TEST_PASSWORD: mirofish-ci-disposable-operations-only
      GRAPHITI_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.25'
      - name: Install locked isolated knowledge runtime
        working-directory: services/knowledge
        run: uv sync --locked --extra test --python 3.12.13
      - name: Install non-editable storage candidate for fresh bundle CLI
        run: uv pip install --python services/knowledge/.venv/bin/python --no-deps --reinstall services/knowledge
      - name: Start disposable PostgreSQL
        run: docker compose -f infra/compose.operations-test.yml up -d --wait --wait-timeout 120
      - name: Verify project revision store
        run: services/knowledge/.venv/bin/python tools/run_project_store_tests.py --postgres
      - name: Qualify DOCX source passages and fresh owned CLI
        run: services/knowledge/.venv/bin/python tools/run_document_source_tests.py
      - name: Qualify portable retained-source bundles and database-free inspection
        run: services/knowledge/.venv/bin/python tools/run_research_bundle_tests.py --integration
      - name: Qualify atomic owned source import and sequential migration rollback
        run: services/knowledge/.venv/bin/python tools/run_research_import_tests.py --integration
      - name: Verify one-time native run authority and owned child lifecycle
        run: services/knowledge/.venv/bin/python tools/run_native_run_ownership_tests.py --postgres
      - name: Test database diagnostics on failure
        if: failure()
        run: docker compose -f infra/compose.operations-test.yml logs --tail 100 postgres
      - name: Remove only this job's disposable database
        if: always()
        run: docker compose -f infra/compose.operations-test.yml down -v
