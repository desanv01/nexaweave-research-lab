name: Bug report
description: Report reproducible, non-sensitive behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use private reporting in SECURITY.md. Do not paste keys, private documents or model payloads here."
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Include commit, OS and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a synthetic or redacted fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: input
    id: capability
    attributes:
      label: Related capability IDs
