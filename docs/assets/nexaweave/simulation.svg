<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
<title id="title">Bounded social simulation illustration</title>
<desc id="desc">Twitter and Reddit simulation lanes share an owner and a bounded budget, leading to recorded events.</desc>
