[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mirofish-knowledge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["graphiti-core==0.30.2", "pydantic>=2.10,<3", "openai>=1.99,<3", "psycopg[binary]==3.3.6"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
execution = ["temporalio==1.33.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mirofish_knowledge = ["migrations/*.sql"]
mirofish_storage = ["migrations/*.sql"]
mirofish_execution = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["neo4j: requires disposable Neo4j and KNOWLEDGE_INTEGRATION=1", "postgres: requires disposable PostgreSQL and KNOWLEDGE_POSTGRES_INTEGRATION=1"]
