name: mirofish-knowledge-u03-test
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: mirofish_operations_test
      POSTGRES_USER: mirofish_fixture
      POSTGRES_PASSWORD: ${KNOWLEDGE_POSTGRES_TEST_PASSWORD:?Set a disposable test password}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - knowledge_u03_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mirofish_fixture", "-d", "mirofish_operations_test"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  knowledge_u03_test_data:
