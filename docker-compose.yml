# Local development only; this is not a qualified application deployment.
services:
  nexaweave:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexaweave:development
    container_name: nexaweave
    env_file:
      - .env
    environment:
      BROWSER: none
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5001:5001"
    volumes:
      - ./backend/uploads:/app/backend/uploads
